name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  verify-tag-on-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tag points to main HEAD
        run: |
          git fetch origin main --depth=1
          TAG_COMMIT="$GITHUB_SHA"
          MAIN_COMMIT="$(git rev-parse origin/main)"

          echo "Tag commit:  $TAG_COMMIT"
          echo "Main commit: $MAIN_COMMIT"

          if [ "$TAG_COMMIT" != "$MAIN_COMMIT" ]; then
            echo "ERROR: Release tags must point to origin/main HEAD."
            exit 1
          fi

  test:
    needs: verify-tag-on-main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build TypeScript packages
        run: bun run build

      - name: Type check
        run: bun run type-check

      - name: Run unit tests
        run: bun run test

      - name: Run integration tests
        working-directory: ./unity-agentic-tools
        run: bash test/cli-integration.test.sh

      - name: Check version sync
        run: bun scripts/sync-version.js --check

  publish:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm version for trusted publishing
        run: npm --version

      - name: Install dependencies
        run: bun install

      - name: Build TypeScript
        run: bun run build

      - name: Publish package
        working-directory: ./unity-agentic-tools
        run: npm publish --provenance --access public

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" $PREV_TAG..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" -10)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release v${{ steps.version.outputs.VERSION }}
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke-test:
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Wait for npm package availability
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in {1..30}; do
            PUBLISHED_VERSION="$(npm view "unity-agentic-tools@${VERSION}" version 2>/dev/null || true)"
            PUBLISHED_VERSION="${PUBLISHED_VERSION//\"/}"

            if [ "$PUBLISHED_VERSION" = "$VERSION" ]; then
              echo "Package unity-agentic-tools@${VERSION} is available"
              exit 0
            fi

            echo "Attempt ${attempt}/30: package not available yet, retrying in 20s"
            sleep 20
          done

          echo "ERROR: unity-agentic-tools@${VERSION} did not appear on npm in time"
          exit 1

      - name: Install published package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for attempt in {1..5}; do
            if npm install -g "unity-agentic-tools@${VERSION}"; then
              exit 0
            fi

            echo "Attempt ${attempt}/5: install failed, retrying in 10s"
            sleep 10
          done

          echo "ERROR: failed to install unity-agentic-tools@${VERSION}"
          exit 1

      - name: Verify the published CLI runs
        shell: bash
        run: |
          OUTPUT=$(unity-agentic-tools status)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q '"runtime":[[:space:]]*"bun"'; then
            echo "Published CLI responded"
          else
            echo "ERROR: unity-agentic-tools status did not report a bun runtime"
            exit 1
          fi
