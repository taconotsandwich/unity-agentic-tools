name: Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build TypeScript packages
        run: bun run build

      - name: Type check
        run: bun run type-check

      - name: Check Unity ClassID drift
        run: bun run check:classids

      - name: Run unit tests
        run: bun run test

      - name: Run CLI integration tests (Unix)
        if: runner.os != 'Windows'
        working-directory: ./unity-agentic-tools
        run: bash test/cli-integration.test.sh
